name = "jhedai-api"
main = "src/index.ts"
compatibility_date = "2025-02-23"

# Variables de entorno
[vars]
FRONTEND_URL = "https://jhedai-redesign.vercel.app"
ALLOWED_ORIGINS = "https://jhedai-redesign.vercel.app,http://localhost:5173"
# Al publicar/editar/borrar un post, dispara el rebuild del sitio estático
# vía GitHub Actions (repository_dispatch). Requiere el secret
# PAGES_DEPLOY_TOKEN (GitHub PAT con Contents: read/write sobre jhedai-astro):
#   npx wrangler secret put PAGES_DEPLOY_TOKEN
PAGES_DEPLOY_HOOK = "https://api.github.com/repos/edisonvasquezd/jhedai-astro/dispatches"

# Configuración de build
[build]
command = "npm run build"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "jhedai-db"
database_id = "29c3ab5b-17c2-436e-9216-3285866a024c"

# KV Cache
[[kv_namespaces]]
binding = "JHEDAI_CACHE"
id = "9ce3757d7c784bd28fd4e266f28cbf46"

# R2 Storage (opcional - para archivos)
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "jhedai-files"
